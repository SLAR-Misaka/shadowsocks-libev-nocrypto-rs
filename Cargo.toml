[workspace]
members = ["crates/protocol", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/SLAR-Misaka/shadowsocks-libev-nocrypto-rs"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
